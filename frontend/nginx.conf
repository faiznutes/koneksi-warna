server {
  listen 4173;
  root /usr/share/nginx/html;
  index index.html;
  location ~* \.(js|css|svg|webp|jpg|jpeg|png|gif|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://backend:3001; }
  location /uploads/ { proxy_pass http://backend:3001; }
  location /admin { proxy_pass http://backend:3001; }
}




